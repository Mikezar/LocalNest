[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localnest"
version = "0.1.0"
description = "Local-first Knowledge and Retrieval Platform"
requires-python = ">=3.15"

dependencies = [
    "fastapi[standard]",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "N", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.15"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"